<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>404 - Page not found</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #09090b;
      color: #f4f4f5;
    }

    body {
      min-height: 100vh;
    }

    main {
      min-height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .card {
      width: 100%;
      max-width: 28rem;
      border: 1px solid #27272a;
      background: #18181b;
      border-radius: 1rem;
      padding: 2rem;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      border: 1px solid rgba(239, 68, 68, 0.2);
      background: rgba(239, 68, 68, 0.1);
      padding: 0.25rem 0.75rem;
      border-radius: 0.375rem;
    }

    .badge span {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: #f87171;
    }

    h1 {
      margin: 1.5rem 0 0;
      font-size: 1.5rem;
      line-height: 2rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: #fff;
    }

    p {
      margin: 0.5rem 0 0;
      font-size: 0.875rem;
      line-height: 1.625;
      color: #a1a1aa;
    }

    .terminal {
      min-height: 32px;
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid #27272a;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    code {
      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        "Liberation Mono",
        monospace;
      font-size: 0.75rem;
      color: #a1a1aa;
    }

    .cursor {
      margin-left: 0.25rem;
      color: #f87171;
      font-weight: 700;
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink {
      0%,
      50% {
        opacity: 1;
      }

      51%,
      100% {
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="card">

      <div class="badge">
        <span>ERROR 404</span>
      </div>

      <h1>Page not found</h1>

      <p>
        The page you're looking for doesn't exist or has been moved.
      </p>

      <div class="terminal">
        <code>
          <span id="message"></span>
          <span class="cursor">_</span>
        </code>
      </div>

    </div>
  </main>

  <script>
    const text = "you are being redirected...";
    const message = document.getElementById("message");

    let index = 0;

    const interval = setInterval(() => {
      if (index <= text.length) {
        message.textContent = text.slice(0, index);
        index++;
      } else {
        clearInterval(interval);
      }
    }, 70);

    setTimeout(() => {
      window.location.href = "/";
    }, 3500);
  </script>
</body>
</html>
