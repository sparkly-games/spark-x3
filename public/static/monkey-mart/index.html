<!doctype html>
<html lang="en">
   <head>
      <meta charset="utf-8" />
      <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
      <meta
         name="viewport"
         content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, minimal-ui, shrink-to-fit=no"
      />
      <meta name="apple-mobile-web-app-capable" content="yes" />
      <title>Monkey Mart Unblocked</title>
      <link rel="icon" type="image/png" href="assets/logo.png" />
      <link rel="stylesheet" href="style.css" />
      <script src="scripts/poki-sdk.js"></script>
   </head>
   <body>
      <div id="app-container" class="canvas-app-container">
         <div id="canvas-container" class="canvas-app-canvas-container">
            <canvas
               id="canvas"
               class="canvas-app-canvas"
               tabindex="1"
               width="960"
               height="640"
            ></canvas>
         </div>
         <div class="buttons-background"></div>
         <!-- center and anchor to bottom of page -->
         <div
            id="progress-bar-root"
            style="
               position: absolute;
               bottom: 16%;
               left: 50%;
               visibility: hidden;
               z-index: 4;
            "
         >
            <!-- <div id="progress-bar-text"> -->
            <img id="progress-bar-bg" src="assets/load_bar_bg.png" />
            <img
               id="progress-bar-fg"
               src="assets/load_bar_fg.png"
               style="position: absolute; clip: rect(0px, 0px, 0px, 0px)"
            />
         </div>
      </div>
      <script
         id="engine-loader"
         type="text/javascript"
         src="scripts/engine/engine-loader.js"
      ></script>
      <!-- -->
      <script
         id="engine-setup"
         type="text/javascript"
         src="scripts/engine/engine-setup.js"
      ></script>
      <script id="engine-startup" type="text/javascript" src="scripts/engine/engine-startup.js"></script>
      <script id="poki-sdk-setup" type="text/javascript" src="scripts/poki.js"></script>
      <script type="text/javascript" src="scripts/GameAnalytics.js"></script>
   </body>
</html>
