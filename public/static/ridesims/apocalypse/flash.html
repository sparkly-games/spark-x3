<div id="flash-container" style="width: 100%; height: 100%;"></div>

<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<script>
  alert("This simulator REQUIRES a keyboard to play. RideSims do not currently provide mobile support for Apocalypse, primarily due to it's complex controls and gameplay.")
  const ruffle = window.RufflePlayer.newest();
  const player = ruffle.createPlayer();
  player.style.width = "100%";
  player.style.height = "100%";
  document.getElementById("flash-container").appendChild(player);
  player.load("../swf/Apocalypse_PC.swf");
</script>
