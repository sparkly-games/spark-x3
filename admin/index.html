<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Redirecting...</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: #f5f5f5;
      background: #0b0b0d;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;

      display: grid;
      place-items: center;

      background: #0b0b0d;
    }

    .redirect-card {
      width: min(400px, calc(100% - 40px));

      padding: 36px;

      background: #111114;
      border: 1px solid #242428;
      border-radius: 14px;

      text-align: center;
    }

    .brand {
      margin-bottom: 32px;
    }

    .brand-title {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .brand-subtitle {
      margin-top: 3px;

      color: #77777f;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
    }

    .spinner {
      width: 24px;
      height: 24px;

      margin: 0 auto 22px;

      border: 2px solid #303036;
      border-top-color: #fff;
      border-radius: 50%;

      animation: spin 0.8s linear infinite;
    }

    h1 {
      margin: 0;

      font-size: 22px;
      letter-spacing: -0.03em;
    }

    p {
      margin: 9px 0 0;

      color: #85858e;
      font-size: 14px;
      line-height: 1.5;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main class="redirect-card">
    <div class="brand">
      <div class="brand-title">ADMIN</div>
      <div class="brand-subtitle">SPARK X3 ADMIN</div>
    </div>

    <div class="spinner"></div>

    <h1>Redirecting...</h1>

    <p>
      Taking you to the administration panel.
    </p>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      setTimeout(() => {
        window.location.replace(
          `https://admin.${window.location.hostname}`
        );
      }, 1000);
    });
  </script>
</body>
</html>
