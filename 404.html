<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost in Space...</title>

    <link rel="icon" href="spark.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="relative h-full overflow-hidden">

    <!-- Background Image -->
    <div class="absolute inset-0 bg-[url('/404-space.jpg')] bg-cover bg-center"></div>

    <!-- Dark Overlay -->
    <div class="absolute inset-0 bg-black/80"></div>

    <!-- Content -->
    <main class="relative z-10 grid min-h-full place-items-center px-6 py-24 sm:py-32 lg:px-8">
        <div class="text-center">
            <p class="text-base font-semibold text-indigo-400">
                404
            </p>

            <h1 class="mt-4 text-5xl font-bold tracking-tight text-white sm:text-7xl">
                Page not found
            </h1>

            <p class="mt-6 text-lg text-gray-300 sm:text-xl">
                Sorry, we couldn't find the page you're looking for.
            </p>

            <div class="mt-10 flex items-center justify-center gap-4">
                <a
                    href="/"
                    class="rounded-lg bg-indigo-600 px-5 py-3 text-sm font-semibold text-white shadow-lg transition hover:bg-indigo-500"
                >
                    Go back home
                </a>
            </div>
        </div>
    </main>

</body>
</html>
